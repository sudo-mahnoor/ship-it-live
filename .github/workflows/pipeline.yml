name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run quality checks
        run: python tests/check_site.py

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp deploy info
        run: |
          mkdir -p _site
          cp -r site/. _site/
          # Fresh asset URLs on every deploy, so phones never run a cached old script
          sed -i "s/app\.js\"/app.js?v=${GITHUB_SHA}\"/; s/style\.css\"/style.css?v=${GITHUB_SHA}\"/" _site/index.html
          cat > _site/version.json <<EOF
          {"sha": "${GITHUB_SHA}", "run": ${GITHUB_RUN_NUMBER}, "time": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"}
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    # Pull requests only get tested; production deploys happen on main
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
